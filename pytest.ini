[pytest]
testpaths = tests
# The Scalekit SDK still uses Pydantic v1-style class Config; not our warning to fix.
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

# NOTE: run tests as
#     PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 pytest
# ROS Jazzy is on PYTHONPATH and registers launch_testing_ros as a pytest plugin,
# which fails to import (missing lark) and then crashes collection with an unknown
# hook. The env var cannot be set from this file, so use ./run_tests.sh.
