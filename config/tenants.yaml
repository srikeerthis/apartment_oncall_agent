# Shared tenant contract.
#
# Read by BOTH halves of the build:
#   - tickets.py      -> Airtable row scoping + the identity every write is stamped with
#   - speaker_map.py  -> MeetStream speaker label -> tenant id
#
# IDENTITY MODEL
# Residents do not own Airtable accounts -- the property company does. So there is
# ONE connected account (below), and per-tenant separation is enforced by:
#   1. Tenant Name written from the resolved identity, never from the transcript
#   2. filterByFormula on every read, injected at a single choke point
#   3. the Virtual MCP Server exposing 2 of Airtable's 48 tools
# Airtable itself has NO row-level permissions -- any credential that can read the
# base can read every row. Do not claim otherwise in the demo.
#
# TWO DIFFERENT NAMES, DO NOT CONFLATE
#   display_name    -> Airtable. Must match the "Tenant Name" cell EXACTLY; it is
#                      the join key for filterByFormula, so a trailing space
#                      silently returns 0 tickets. Renaming it orphans existing rows.
#   speaker_labels  -> MeetStream. Whatever the person's account shows in the call.
#                      Google sends more than one string for the same person
#                      (caption.speakerName AND caption.speakerDisplayName), so
#                      list every variant. Matching is normalized (lowercased,
#                      whitespace-collapsed); an unmatched label resolves to None,
#                      never a guess -- a misfiled ticket is worse than a missed one.
#
# Tenant ids are the unit, lowercased: unit_4b, unit_2a, ...

property_manager:
  # The single Airtable account that owns the Maintenance Requests base.
  # This is the identifier the Scalekit connected account is keyed on.
  identifier: srikeerthisrinivasan1@gmail.com
  connection_name: airtable

tenants:
  # --- demo personas -------------------------------------------------------
  unit_4b:
    display_name: Dana Reyes
    unit: "4B"
    speaker_labels:
      - Dana Reyes
      - Dana

  unit_2a:
    display_name: Sam Okafor
    unit: "2A"
    speaker_labels:
      - Sam Okafor
      - Sam

  # --- real accounts, each their own resident ------------------------------
  unit_3c:
    display_name: Srikeerthi Srinivasan
    unit: "3C"
    speaker_labels:
      # Confirmed from data/transcript_log.jsonl on a live Meet call. Google
      # sends TWO different strings and the bridge reads speakerDisplayName,
      # so both are listed -- do not prune either.
      - srikeerthi          # caption.speakerDisplayName
      - srikeerthi s        # caption.speakerName
      - Srikeerthi Srinivasan

  unit_1a:
    display_name: Anirudh Kompella
    unit: "1A"
    speaker_labels:
      - Anirudh Kompella
      - Anirudh
